# Starting suggestions for Redmine's texts in Swedish (GK Fields, Translations, Redmine's texts).
# Each one is offered next to the key on the page and applied only when an administrator takes it and saves.
# Keys that Redmine in this instance does not have, or already has with the same text, are not offered.
# The line above a key is Redmine's English text.


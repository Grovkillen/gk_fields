  text_gk_fields_layout_preview_no_issue: "Det ärendet finns inte, eller du får inte se det. Skriv ett nummer eller en del av ämnet och välj ett ärende i listan."
  text_gk_fields_layout_preview_find: "Nummer eller ämne"
  text_gk_fields_layout_preview_find_help: "Skriv ett nummer eller en del av ämnet; ärenden med ärendetypen som är vald ovan, och med statusen och projektet när de är valda, föreslås medan du skriver."
  text_gk_fields_layout_preview_other_tracker: "Ärende %{issue} är av ärendetypen %{tracker}, och den här layouten är för %{layout}. En förhandsgranskning skulle inte visa layoutens fält; välj ett ärende av ärendetypen %{layout}."
  text_gk_fields_layout_preview_other_status: "Ärende %{issue} har statusen %{status}, och den här layouten gäller bara %{status_layout}. Förhandsgranskningen visar avsnitten, men ärendesidan använder inte den här layouten för det ärendet."
  text_gk_fields_layout_preview_other_project: "Ärende %{issue} hör till projektet %{project}, och den här layouten gäller bara %{project_layout}. Förhandsgranskningen visar avsnitten, men ärendesidan använder inte den här layouten för det ärendet."

  label_gk_feature_fields_layouts: "Layouts"
  text_gk_feature_fields_layouts: "Administration > Layouts and a layout's sections on the issue page and in the form. Needs GK Access. Off: the menu entry and the pages are gone and an issue is drawn as in Redmine; saved layouts stay untouched."

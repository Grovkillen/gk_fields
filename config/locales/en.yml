en:
  label_gk_fields_about: "About the plugin"
  label_gk_fields_changelog: "Change log"
  text_gk_fields_changelog_english: "The change log is always written in English."
  label_gk_fields_languages: "Languages"
  text_gk_fields_description: "The custom field format Date and time, names per language for what Redmine keeps as one text, Redmine's own texts corrected per language, and layouts of an issue's head."
  text_gk_fields_access_missing: "GK Access is missing. The layouts need its levels and are off until GK Access is installed. The translations, Redmine's texts and the field format Date and time work without it."
  text_gk_fields_core_language_default: "By the system setting (%{language})"
  text_gk_fields_content_languages_default: "By the system setting (%{languages})"
  label_gk_fields_translations: "Translations"
  label_gk_fields_layouts: "Layouts"
  label_gk_fields_layout_new: "New layout"
  text_gk_fields_layouts_intro: "A layout divides an issue's head into sections for a tracker, and may apply to one status and one project. A project's layout goes before the instance's, a status's before the one for all statuses. Fields no layout names go to the section Other."
  label_gk_fields_layout_scope: "Applies to"
  label_gk_fields_layout_scope_show: "the issue page"
  label_gk_fields_layout_scope_edit: "the form"
  label_gk_fields_layout_sections: "Sections"
  label_gk_fields_layout_section: "Section of a layout"
  label_gk_fields_layout_all_statuses: "all statuses"
  label_gk_fields_layout_instance: "the whole instance"
  label_gk_fields_layout_other: "Other"
  label_gk_fields_layout_preview: "Preview"
  label_gk_fields_layout_preview_issue: "Issue to preview with"
  text_gk_fields_layout_json_help: "JSON: sections is a list of sections with key, title per language (an object of language code and text), columns (1 or 2), level (the key of one of the levels on Administration > Levels, for example open, internal or sensitive), collapsed (true or false) and fields. A field is the key of one of Redmine's fields (for example status or priority) or cf:<id>, with width (half or full) and appearance per context (show, edit, small)."
  text_gk_fields_layout_preview_no_issue: "That issue does not exist, or you may not see it. Write a number or part of the subject and choose an issue in the list."
  text_gk_fields_layout_preview_find: "Number or subject"
  text_gk_fields_layout_preview_find_help: "Write a number or part of the subject; the issues of the tracker chosen above, and of the status and project when they are chosen, are suggested as you write."
  text_gk_fields_layout_preview_other_tracker: "Issue %{issue} is of the tracker %{tracker}, and this layout is for %{layout}. Its preview would not show the layout's fields; choose an issue of the tracker %{layout}."
  text_gk_fields_layout_preview_other_status: "Issue %{issue} has the status %{status}, and this layout applies only to %{status_layout}. The preview shows the sections, but the issue page does not use this layout for that issue."
  text_gk_fields_layout_preview_other_project: "Issue %{issue} is in the project %{project}, and this layout applies only to %{project_layout}. The preview shows the sections, but the issue page does not use this layout for that issue."
  label_gk_fields_you_see: "You see: %{levels}"
  label_gk_fields_appearance_standard: "Standard"
  error_gk_fields_layout_json: "is not valid JSON with a list sections"
  error_gk_fields_layout_section: "section %{n} is not an object"
  error_gk_fields_layout_key: "section %{n} has no valid key (lower case letters, digits and underscores)"
  error_gk_fields_layout_key_twice: "the key %{key} is in more than one section"
  error_gk_fields_layout_title: "section %{n} has no title"
  error_gk_fields_layout_columns: "section %{n}: columns must be 1 or 2"
  error_gk_fields_layout_collapsed: "section %{n}: collapsed must be true or false"
  error_gk_fields_layout_level: "section %{n}: level must be one of the levels (%{levels})"
  error_gk_fields_layout_level_closed: "section %{n}: the level %{level} is closed for new things"
  error_gk_fields_layout_field: "section %{n}: the field %{field} does not exist"
  error_gk_fields_layout_field_twice: "the field %{field} is in more than one section"
  error_gk_fields_layout_not_tracker: "the field %{field} does not belong to the tracker"
  error_gk_fields_layout_width: "the field %{field}: width must be half or full"
  error_gk_fields_layout_appearance: "the field %{field}: the appearance %{appearance} does not exist for %{context}"
  error_gk_fields_layout_appearance_object: "the field %{field}: appearance must be an object of context (show, edit, small) and appearance"
  error_gk_fields_layout_level_lower: "section %{n} cannot be less protected than its fields (at least %{level})"
  error_gk_fields_layout_level_open_field: "section %{n} at the level %{level} has fields everyone sees (%{fields}). The level hides them on the issue page only; REST, export, the history, mail and search follow each field's visibility per role. Limit the fields per role, or put them in another section."
  error_gk_fields_layout_required_above: "the field %{field} is required for the role %{role}, but the section %{section} is at the level %{level}, above the role's ceiling; someone with only that role cannot save the issue. Move the field to a section the role sees, or raise the role's ceiling."
  text_gk_fields_translations: "The names here are written in %{language}. That text is never changed by a translation: it is the key, and it is shown when a language has no translation. Fill in the name in the other languages."
  text_gk_fields_no_languages: "There is no other language to translate to. Add languages in the plugin's settings."
